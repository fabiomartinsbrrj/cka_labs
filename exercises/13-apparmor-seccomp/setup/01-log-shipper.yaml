apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-shipper
  namespace: telemetry
  labels:
    app: log-shipper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-shipper
  template:
    metadata:
      labels:
        app: log-shipper
    spec:
      containers:
        - name: log-shipper
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/log/app && while true; do echo \"$(date) heartbeat\" >> /var/log/app/app.log; sleep 5; done"]
