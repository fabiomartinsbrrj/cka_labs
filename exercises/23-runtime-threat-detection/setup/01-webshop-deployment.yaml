apiVersion: apps/v1
kind: Deployment
metadata:
  name: webshop
  namespace: exposed-app
  labels:
    app: webshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webshop
  template:
    metadata:
      labels:
        app: webshop
    spec:
      containers:
        - name: webshop
          image: nginx:1.25
          ports:
            - containerPort: 80
