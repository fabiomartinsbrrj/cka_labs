apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-watcher
  namespace: jobs
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configmap-watcher-binding
  namespace: jobs
subjects:
  - kind: ServiceAccount
    name: default
    namespace: jobs
roleRef:
  kind: Role
  name: configmap-watcher
  apiGroup: rbac.authorization.k8s.io
