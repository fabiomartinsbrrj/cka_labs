apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: project-b
spec:
  replicas: 1
  selector:
    matchLabels:
      role: db
  template:
    metadata:
      labels:
        role: db
    spec:
      containers:
      - name: db
        image: postgres:15-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "study123"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: project-b
spec:
  selector:
    role: db
  ports:
  - port: 5432
    targetPort: 5432
