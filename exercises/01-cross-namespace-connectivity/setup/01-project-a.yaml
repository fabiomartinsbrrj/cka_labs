apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: project-a
spec:
  replicas: 1
  selector:
    matchLabels:
      role: web
  template:
    metadata:
      labels:
        role: web
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command: ["sleep", "3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service
  namespace: project-a
spec:
  replicas: 1
  selector:
    matchLabels:
      role: service
  template:
    metadata:
      labels:
        role: service
    spec:
      containers:
      - name: service
        image: busybox:1.36
        command: ["sleep", "3600"]
