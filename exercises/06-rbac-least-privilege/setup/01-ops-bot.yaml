apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-bot
  namespace: platform-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-bot-cluster-admin
subjects:
  - kind: ServiceAccount
    name: ops-bot
    namespace: platform-ops
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
