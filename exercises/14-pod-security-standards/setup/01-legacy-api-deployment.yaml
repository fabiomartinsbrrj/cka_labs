apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-api
  namespace: payments
  labels:
    app: legacy-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legacy-api
  template:
    metadata:
      labels:
        app: legacy-api
    spec:
      containers:
        - name: legacy-api
          image: nginx:1.25
          ports:
            - containerPort: 80
          securityContext:
            runAsUser: 0
            privileged: true
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
