apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-api
  namespace: analytics
  labels:
    app: reporting-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reporting-api
  template:
    metadata:
      labels:
        app: reporting-api
    spec:
      containers:
        - name: reporting-api
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
